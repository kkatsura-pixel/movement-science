<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>統合運動科学リファレンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2521;
    --paper:#f6f4ee;
    --paper-dim:#eae6db;
    --line:#d8d2c2;
    --moss:#5b6e4f;
    --moss-dim:#8a9a7c;
    --clay:#a8503a;
    --clay-dim:#e7d3cb;
    --gold:#b08d3f;
    --radius:12px;
    --serif: "Noto Serif JP", Georgia, "Hiragino Mincho ProN", "Yu Mincho", serif;
    --serif-en: "Cormorant Garamond", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:74px;
    min-height:100vh;
    letter-spacing:.01em;
  }
  #app{max-width:640px;margin:0 auto;}

  /* Header */
  header.top{
    padding:34px 20px 22px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--paper);z-index:20;
  }
  header.top .eyebrow{
    font-family:var(--serif-en);font-size:13px;letter-spacing:.22em;color:var(--moss);text-transform:uppercase;font-weight:600;
  }
  header.top h1{
    font-family:var(--serif-en);
    font-size:26px;margin:8px 0 0;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  }

  /* Screens */
  .screen{display:none;padding:22px 20px 12px;}
  .screen.active{display:block;}

  /* Filters */
  .filters{
    display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
  }
  select{
    flex:1;min-width:0;
    appearance:none;-webkit-appearance:none;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;font-size:13px;color:var(--ink);font-family:var(--sans);
  }
  input[type=text], input[type=search], input[type=number]{
    width:100%;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:var(--sans);
    margin-bottom:10px;box-sizing:border-box;-webkit-appearance:none;appearance:none;
  }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0;
  }

  .count-row{font-size:12px;color:#767267;margin-bottom:10px;}

  .filter-info{
    background:#eef2e9;border:1px solid var(--moss-dim);border-left:4px solid var(--gold);
    border-radius:0 12px 12px 0;padding:16px 18px;margin-bottom:14px;
  }
  .filter-info + .filter-info{margin-top:0;}
  .filter-info .fi-label{font-size:11px;font-weight:400;color:#767267;letter-spacing:.04em;margin-bottom:3px;}
  .filter-info .fi-title{font-family:var(--serif);font-size:15.5px;font-weight:700;color:#2e3d27;margin-bottom:5px;}
  .filter-info .fi-content{font-size:12.5px;line-height:1.75;color:#465239;}

  /* Exercise cards */
  .ex-list{display:flex;flex-direction:column;gap:12px;}
  .ex-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px;
    cursor:pointer;
  }
  .ex-card:active{background:var(--paper-dim);}
  .ex-card .name-ja{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.01em;}
  .ex-card .name-en{font-family:var(--serif-en);font-size:12px;font-style:italic;color:#8a857a;margin-top:3px;letter-spacing:.02em;}
  .ex-card .meta{display:flex;gap:6px;flex-shrink:0;}
  .badge{
    font-size:10px;padding:3px 7px;border-radius:20px;white-space:nowrap;
    border:1px solid var(--line);color:#6a6558;
  }
  .badge.layer{background:var(--paper-dim);}
  .badge.diff{background:#FAEEDA;color:#854F0B;border-color:transparent;font-weight:600;}

  .empty-state{
    text-align:center;padding:40px 20px;color:#928d80;font-size:14px;
  }

  /* Detail screen */
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--moss);
    background:none;border:none;padding:0 0 14px;cursor:pointer;font-weight:600;
  }
  .detail-head h2{font-family:var(--serif);font-size:25px;margin:0;font-weight:700;letter-spacing:.01em;}
  .detail-head .name-en{font-family:var(--serif-en);font-size:15px;font-style:italic;color:#8a857a;margin-top:3px;letter-spacing:.02em;}
  .detail-head .tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
  .tag-chip{font-size:11px;background:var(--paper-dim);border-radius:20px;padding:3px 9px;color:#5c574c;}
  .tag-chip.tag-layer{background:#e2e9f0;color:#3d5a80;}
  .tag-chip.tag-domain{background:#f1e6d0;color:#8a6d1f;}
  .tag-chip.tag-difficulty{background:#FAEEDA;color:#854F0B;font-weight:600;}
  .tag-chip.tag-effect{background:#e4ece0;color:var(--moss);}

  .warn-box{
    margin-top:20px;background:var(--clay-dim);border-left:3px solid var(--clay);
    border-radius:0 10px 10px 0;padding:16px 18px;font-size:13.5px;line-height:1.7;color:#6b2f1f;
  }
  .warn-box .label{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--clay);}

  .section{margin-top:32px;}
  .section .label{
    font-size:18px;font-family:var(--serif);color:var(--moss);font-weight:700;
    margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid var(--gold);letter-spacing:.04em;
  }
  .section .body{font-size:14.5px;line-height:1.85;color:#33362f;white-space:pre-wrap;}

  .branch-tabs{display:flex;gap:8px;margin-top:12px;}
  .branch-tab{
    flex:1;text-align:center;font-size:12px;padding:8px 4px;border-radius:8px;
    background:var(--paper-dim);color:#5c574c;cursor:pointer;border:1px solid transparent;
  }
  .branch-tab.active{background:var(--ink);color:var(--paper);}
  .branch-tab[data-branch="progressions"]{background:#E6F1FB;color:#0C447C;}
  .branch-tab[data-branch="progressions"].active{background:#185FA5;color:#E6F1FB;}
  .branch-tab[data-branch="regressions"]{background:#FAEEDA;color:#854F0B;}
  .branch-tab[data-branch="regressions"].active{background:#BA7517;color:#FAEEDA;}
  .branch-tab[data-branch="errors"]{background:#FCEBEB;color:#A32D2D;}
  .branch-tab[data-branch="errors"].active{background:#A32D2D;color:#FCEBEB;}
  .branch-panel{display:none;margin-top:14px;}
  .branch-panel.active{display:block;}
  .chip-list{display:flex;flex-direction:column;gap:10px;}
  .chip-link{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .chip-link:active{background:var(--paper-dim);}
  .chip-link .arrow{color:var(--moss);}

  /* Generator */
  .gform{display:flex;flex-direction:column;gap:12px;}
  .gform label{font-size:12px;font-weight:700;color:#5c574c;letter-spacing:.03em;}
  .gform .field{display:flex;flex-direction:column;gap:5px;}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:14px;font-family:var(--sans);min-height:64px;resize:vertical;background:#fff;color:var(--ink);
  }
  .gen-btn{
    margin-top:4px;background:var(--moss);color:#fff;border:none;border-radius:8px;
    padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .gen-btn:disabled{background:#b7bfae;}
  .gen-result{margin-top:24px;}
  .gen-para{font-size:14px;line-height:1.8;color:#4a463c;margin:0 0 20px;}

  .gen-timeline{position:relative;}
  .gen-tl-item{position:relative;padding-left:40px;margin-bottom:18px;}
  .gen-tl-item::before{
    content:"";position:absolute;left:14px;top:34px;bottom:-18px;width:2px;background:var(--line);
  }
  .gen-tl-item:last-child::before{display:none;}
  .gen-tl-badge{
    position:absolute;left:0;top:0;width:29px;height:29px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;
  }
  .gen-tl-badge.eval{background:var(--clay);font-size:14px;}
  .gen-tl-badge.item{background:var(--moss);font-family:var(--sans);font-size:15px;font-weight:700;}
  .gen-tl-body{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;}
  .gen-tl-item.eval .gen-tl-body{background:var(--clay-dim);border-color:transparent;}

  .gen-item-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .gen-item-tags .badge{font-size:10px;padding:3px 8px;border-radius:20px;border:none;}
  .gen-item-body{font-size:14px;line-height:1.8;color:#4a463c;}
  .gen-exname{color:var(--moss);font-weight:700;font-size:16px;display:block;margin-bottom:6px;}
  .gen-eval-name{color:#8a3524;font-weight:700;font-size:14.5px;display:block;margin-bottom:4px;}
  .gen-summary{
    margin-top:22px;padding-top:18px;border-top:2px solid var(--gold);
    font-size:13.5px;line-height:1.85;color:#4a463c;
  }
  .loading{font-size:13px;color:var(--moss);margin-top:14px;}
  .error-box{
    margin-top:14px;background:var(--clay-dim);color:#6b2f1f;border-radius:8px;padding:12px 14px;font-size:13px;
  }

  /* Tab bar */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;background:var(--paper);
    border-top:1px solid var(--line);display:flex;z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;background:none;border:none;padding:11px 4px 9px;font-size:11px;
    color:#9a9587;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--sans);
  }
  nav.tabbar button .ic{font-size:19px;line-height:1;}
  nav.tabbar button.active{color:var(--moss);font-weight:700;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="eyebrow">Movement Science</div>
    <h1 id="headerTitle">Exercise Library</h1>
  </header>

  <!-- 一覧画面 -->
  <section class="screen active" id="screen-list">
    <div class="filters">
      <select id="f-layer"><option value="">領域：すべて</option></select>
      <select id="f-domain"><option value="">レイヤー：すべて</option></select>
      <select id="f-difficulty"><option value="">難易度：すべて</option></select>
    </div>
    <input type="search" id="f-tags" placeholder="効果で検索（例：脊柱可動性改善）">
    <input type="search" id="f-purpose" placeholder="目的で検索（概要から検索）">
    <input type="search" id="f-search" placeholder="種目名で検索">
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5c574c;margin-bottom:10px;">
      <input type="checkbox" id="f-fav-only" style="width:auto;margin:0;"> お気に入りのみ表示
    </label>
    <div id="filterInfo" style="margin-top:14px;"></div>
    <div class="count-row" id="listCount"></div>
    <div class="ex-list" id="exList"></div>
  </section>

  <!-- 詳細画面 -->
  <section class="screen" id="screen-detail">
    <button class="back-btn" onclick="goToList()">← 一覧に戻る</button>
    <div id="detailBody"></div>
  </section>

  <!-- ジェネレーター画面 -->
  <section class="screen" id="screen-generator">
    <div class="gform">
      <div class="field">
        <label>目的</label>
        <input type="text" id="g-purpose" placeholder="例：肩こり改善、姿勢改善、パフォーマンス向上">
      </div>
      <div class="field">
        <label>身体状態・注意点</label>
        <textarea id="g-condition" placeholder="例：右肩に既往あり、座位時間が長い"></textarea>
      </div>
      <div class="field">
        <label>レベル</label>
        <select id="g-level">
          <option value="">指定なし</option>
        </select>
      </div>
      <div class="field">
        <label>レイヤー</label>
        <select id="g-domain">
          <option value="">指定なし</option>
        </select>
      </div>
      <div class="field">
        <label>年齢</label>
        <input type="number" id="g-age" placeholder="例：35" min="1" max="120">
      </div>
      <div class="field">
        <label>所要時間</label>
        <select id="g-duration">
          <option value="">指定なし</option>
          <option value="10">10分</option>
          <option value="20">20分</option>
          <option value="30">30分</option>
          <option value="45">45分</option>
          <option value="60">60分</option>
        </select>
      </div>
      <button class="gen-btn" id="genBtn" onclick="generateProgram()">プログラムを生成する</button>
    </div>
    <div class="gen-result" id="genResult"></div>
  </section>

  <nav class="tabbar">
    <button class="active" id="tab-list" onclick="switchTab('list')">
      <span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>一覧
    </button>
    <button id="tab-detail" onclick="switchTab('detail')" style="display:none;">
      <span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2-1 5-1.3 8 0v13c-3-1.3-6-1-8 0z"/><path d="M20 5.5c-2-1-5-1.3-8 0v13c3-1.3 6-1 8 0z"/></svg></span>詳細
    </button>
    <button id="tab-generator" onclick="switchTab('generator')">
      <span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/><circle cx="12" cy="12" r="2.3"/></svg></span>生成
    </button>
  </nav>
</div>

<script>
/* ============ 設定（このセクションだけ環境に合わせて調整） ============ */
const SUPABASE_URL = "https://fxqwdnuavjazpozndxkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SLEtu3hH-UlcsdspfoOr1Q_g3vBV8B5";
const WORKER_URL = "https://movement-science-proxy.koshiro-katsura.workers.dev";
/* ==================================================================== */

let allExercises = [];
let currentDetail = null;

const FAV_KEY = "movementScienceFavorites";
function getFavorites(){
  try{
    return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
  }catch(e){ return []; }
}
function isFavorite(name){
  return getFavorites().includes(name);
}
function toggleFavorite(name, event){
  if(event) event.stopPropagation();
  let favs = getFavorites();
  if(favs.includes(name)){
    favs = favs.filter(n => n !== name);
  }else{
    favs.push(name);
  }
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
  renderList();
  if(currentDetail && currentDetail.name_ja === name) renderDetail(currentDetail);
}

async function fetchExercises(){
  const url = `${SUPABASE_URL}/rest/v1/exercises?select=*`;
  const res = await fetch(url, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    }
  });
  if(!res.ok){
    throw new Error(`Supabase取得エラー: ${res.status}`);
  }
  return await res.json();
}

function uniqueValues(list, key){
  return [...new Set(list.map(x => x[key]).filter(v => v !== null && v !== undefined && v !== ""))];
}

function splitMultiValue(str){
  if(str === null || str === undefined || str === "") return [];
  return String(str).split(",").map(s => s.trim()).filter(Boolean);
}

function uniqueSplitValues(list, key){
  const set = new Set();
  list.forEach(x => splitMultiValue(x[key]).forEach(v => set.add(v)));
  return [...set].sort();
}

function populateFilters(){
  const layers = uniqueSplitValues(allExercises, "layer");
  const domains = uniqueSplitValues(allExercises, "domain");
  const difficulties = uniqueValues(allExercises, "difficulty");

  fillSelect("f-layer", layers, "領域：すべて", false, layerLabel);
  fillSelect("f-domain", domains, "レイヤー：すべて");
  fillSelect("f-difficulty", difficulties, "難易度：すべて", true);
  fillSelect("g-level", difficulties, "指定なし", true);
  fillSelect("g-domain", domains, "指定なし");
}

function fillSelect(id, values, defaultLabel, isDifficulty, labelFn){
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${defaultLabel}</option>`;
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = isDifficulty ? "★".repeat(Math.max(1, parseInt(v,10)||1)) : (labelFn ? labelFn(v) : v);
    el.appendChild(opt);
  });
}

function minLayerNumber(layerStr){
  const nums = splitMultiValue(layerStr).map(t => {
    const m = t.match(/(\d)/);
    return m ? parseInt(m[1], 10) : 99;
  });
  return nums.length ? Math.min(...nums) : 99;
}

function applyFilters(){
  const layer = document.getElementById("f-layer").value;
  const domain = document.getElementById("f-domain").value;
  const difficulty = document.getElementById("f-difficulty").value;
  const tagSearch = document.getElementById("f-tags").value.trim().toLowerCase();
  const purposeSearch = document.getElementById("f-purpose").value.trim().toLowerCase();
  const nameSearch = document.getElementById("f-search").value.trim().toLowerCase();
  const favOnly = document.getElementById("f-fav-only").checked;
  const favs = favOnly ? getFavorites() : null;

  return allExercises.filter(ex => {
    if(favOnly && !favs.includes(ex.name_ja)) return false;
    if(layer && !splitMultiValue(ex.layer).includes(layer)) return false;
    if(domain && !splitMultiValue(ex.domain).includes(domain)) return false;
    if(difficulty && String(ex.difficulty) !== String(difficulty)) return false;
    if(tagSearch){
      const tagHay = String(ex.tags || "").toLowerCase();
      if(!tagHay.includes(tagSearch)) return false;
    }
    if(purposeSearch){
      const purposeHay = `${ex.overview||""} ${ex.confirmation||""} ${ex.precautions||""} ${ex.tags||""} ${ex.error_patterns||""} ${ex.indications||""}`.toLowerCase();
      if(!purposeHay.includes(purposeSearch)) return false;
    }
    if(nameSearch){
      const nameHay = `${ex.name_ja||""} ${ex.name_en||""} ${ex.name_custom||""}`.toLowerCase();
      if(!nameHay.includes(nameSearch)) return false;
    }
    return true;
  }).sort((a, b) => {
    const la = minLayerNumber(a.layer), lb = minLayerNumber(b.layer);
    if(la !== lb) return la - lb;
    const da = parseInt(a.difficulty, 10) || 0, db = parseInt(b.difficulty, 10) || 0;
    if(da !== db) return da - db;
    return (a.name_ja || "").localeCompare(b.name_ja || "", "ja");
  });
}

function renderList(){
  const filtered = applyFilters();
  const listEl = document.getElementById("exList");
  const countEl = document.getElementById("listCount");
  const infoEl = document.getElementById("filterInfo");
  countEl.textContent = `${filtered.length}件`;

  const layerVal = document.getElementById("f-layer").value;
  const domainVal = document.getElementById("f-domain").value;
  let infoHtml = "";
  if(layerVal && LAYER_INFO[layerVal]){
    infoHtml += `<div class="filter-info"><div class="fi-label">領域</div><div class="fi-title">${escapeHtml(LAYER_INFO[layerVal].title)}</div><div class="fi-content">内容：${escapeHtml(LAYER_INFO[layerVal].content)}</div></div>`;
  }
  if(domainVal){
    const idx = domainMatchIndex(domainVal);
    if(idx !== -1){
      infoHtml += `<div class="filter-info"><div class="fi-label">レイヤー</div><div class="fi-title">${escapeHtml(domainVal)}</div><div class="fi-content">内容：${escapeHtml(DOMAIN_CONTENT[idx])}</div></div>`;
    }
  }
  infoEl.innerHTML = infoHtml;

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">該当するエクササイズがありません</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(ex => {
    const lc = layerColorPair(ex.layer);
    const dc = domainColorPair(ex.domain);
    const fav = isFavorite(ex.name_ja);
    return `
    <div class="ex-card" onclick="openDetailByName('${escapeAttr(ex.name_ja)}')">
      <div>
        <div class="name-ja">${escapeHtml(ex.name_ja || ex.name_custom || "(名称未設定)")}</div>
        ${ex.name_en ? `<div class="name-en">${escapeHtml(ex.name_en)}</div>` : ""}
        <div class="meta" style="margin-top:6px;">
          ${ex.layer ? `<span class="badge" style="background:${lc[0]};color:${lc[1]};border-color:transparent;font-weight:600;">${escapeHtml(layerLabels(ex.layer))}</span>` : ""}
          ${ex.domain ? `<span class="badge" style="background:${dc[0]};color:${dc[1]};border-color:transparent;font-weight:600;">${escapeHtml(String(ex.domain).split(",")[0].trim())}</span>` : ""}
        </div>

        <span onclick="toggleFavorite('${escapeAttr(ex.name_ja)}', event)" style="cursor:pointer;font-size:20px;color:${fav ? "#b08d3f" : "#d8d2c2"};line-height:1;">${fav ? "★" : "☆"}</span>
        ${ex.difficulty ? `<span class="badge diff">${difficultyStars(ex.difficulty)}</span>` : ""}

function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(str){
  return String(str||"").replace(/'/g, "\\'");
}

const STAR_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" style="vertical-align:-2px;margin-right:1px;"><path fill="currentColor" d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.6 5.9 21l1.5-6.8L2.2 9.5l6.9-.7z"/></svg>';

function difficultyStars(val){
  const n = parseInt(val, 10);
  if(!n || n < 1) return escapeHtml(val);
  return STAR_SVG.repeat(Math.min(n, 5));
}

function domainColorPair(domainStr){

function toArray(val){
  if(Array.isArray(val)) return val;
  if(val === null || val === undefined || val === "") return [];
  if(typeof val === "string"){
    try{
      const parsed = JSON.parse(val);
      if(Array.isArray(parsed)) return parsed;
    }catch(e){}
    return val.split(/[,、。]/).map(s => s.trim()).filter(Boolean);
  }
  return [];
}

/* ============ プログラムジェネレーター（Gemini API / Cloudflare Worker経由） ============ */
async function generateProgram(){
  const purpose = document.getElementById("g-purpose").value.trim();
  const condition = document.getElementById("g-condition").value.trim();
  const level = document.getElementById("g-level").value;
  const domain = document.getElementById("g-domain").value;
  const age = document.getElementById("g-age").value.trim();
  const duration = document.getElementById("g-duration").value;
  const resultEl = document.getElementById("genResult");
  const btn = document.getElementById("genBtn");

  if(!purpose){
    resultEl.innerHTML = `<div class="error-box">目的を入力してください。</div>`;
    return;
  }

  btn.disabled = true;
  resultEl.innerHTML = `<div class="loading">生成中です…</div>`;

  const durationToCount = { "10": 3, "20": 5, "30": 6, "45": 8, "60": 10 };
  const itemCount = durationToCount[duration] || 5;

  // 候補種目リストを簡潔な形でプロンプトに渡す
  const candidateList = allExercises
    .filter(ex => (!domain || splitMultiValue(ex.domain).includes(domain)))
    .map(ex => `・${ex.name_ja}｜領域:${ex.layer||"-"}｜レイヤー:${ex.domain||"-"}｜難易度:${ex.difficulty||"-"}`)
    .join("\n");

  const prompt = `あなたは運動科学と身体教育の専門家です。以下の条件に基づき、まず推奨されるスクリーニング・評価を提示し、次に下記の候補リストの中から${itemCount}種目を選び、選定理由と実施順序を日本語で提案してください。候補リストにない種目は提案しないでください。

【目的】
${purpose}

【身体状態・注意点】
${condition || "特になし"}

【年齢】
${age || "指定なし"}

【希望レベル】
${level || "指定なし"}

【希望レイヤー】
${domain || "指定なし"}

【所要時間】
${duration ? duration + "分" : "指定なし"}

【候補リスト】
${candidateList}

出力形式：
1. まず、目的に応じた推奨スクリーニング・評価を2〜3個、「◆評価名」の形式で明記し、①何を評価するためのものか②その結果から何がわかるかを1〜2文で添えてください。可動域テスト・姿勢観察・動作観察・呼吸パターン評価など、一般的な運動学・評価学の用語で表現し、特定の団体・企業の固有名称やブランド名は使用しないでください。
2. 次に、候補リストの中から${itemCount}種目を選び「・種目名」の形式で明記し、選定理由を1〜2文で添えてください。年齢が指定されている場合は年代に応じた負荷・注意点も考慮してください。
3. 最後に、実施順序と全体の狙いを、なぜこの組み合わせ・順序が目的の達成に有効なのか、関連する生理学的・運動学的な理由を含めて詳しく説明してください。単なる手順の要約ではなく、種目間のつながり（例：前段の種目がどう後段の種目の土台になるか）にも触れてください。`;

  try{
    const res = await fetch(`${WORKER_URL}?target=gemini`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });

    if(!res.ok){
      throw new Error(`Worker応答エラー: ${res.status}`);
    }

    const data = await res.json();
    // Workerのレスポンス形式は既存プロキシに合わせて調整してください（例：{ text: "..." } を想定）
    const text = data.text || data.result || data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data);
    const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];

    const boldify = (s, cls) => s.replace(/\*\*(.+?)\*\*/g, `<span class="${cls}">$1</span>`);
    const paragraphs = escapeHtml(text).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);

    let evalIndex = 0;
    let itemIndex = 0;
    let sawItem = false;
    let inTimeline = false;
    let html = "";

    paragraphs.forEach(p => {
      if(/^◆/.test(p)){
        if(!inTimeline){ html += `<div class="gen-timeline">`; inTimeline = true; }
        evalIndex++;
        const body = boldify(p.replace(/^◆\s*/, ""), "gen-eval-name");
        html += `<div class="gen-tl-item eval"><div class="gen-tl-badge eval">評</div><div class="gen-tl-body">${body}</div></div>`;
        return;
      }
      if(/^・/.test(p)){
        if(!inTimeline){ html += `<div class="gen-timeline">`; inTimeline = true; }
        sawItem = true;
        itemIndex++;
        const num = itemIndex;
        let raw = p.replace(/^・\s*/, "");
        const nameMatch = raw.match(/\*\*(.+?)\*\*/);
        const rawName = nameMatch ? nameMatch[1] : null;
        const matched = rawName ? allExercises.find(e => e.name_ja === rawName) : null;
        const body = boldify(raw, "gen-exname");
        let tagsHtml = "";
        let clickAttr = "";
        if(matched){
          const lc = layerColorPair(matched.layer);
          const dc = domainColorPair(matched.domain);
          tagsHtml = `<div class="gen-item-tags">
            <span class="badge" style="background:${lc[0]};color:${lc[1]};">${escapeHtml(layerLabels(matched.layer))}</span>
            <span class="badge" style="background:${dc[0]};color:${dc[1]};">${escapeHtml(String(matched.domain).split(",")[0].trim())}</span>
          </div>`;
          clickAttr = ` onclick="openDetailByName('${escapeAttr(matched.name_ja)}')" style="cursor:pointer;"`;
        }
        html += `<div class="gen-tl-item item"${clickAttr}><div class="gen-tl-badge item">${num}</div><div class="gen-tl-body"><div class="gen-item-body">${body}</div>${tagsHtml}</div></div>`;
        return;
      }
      if(inTimeline){ html += `</div>`; inTimeline = false; }
      const cls = sawItem ? "gen-summary" : "gen-para";
      html += `<div class="${cls}">${boldify(p, "gen-exname")}</div>`;
    });
    if(inTimeline) html += `</div>`;

    resultEl.innerHTML = html;
  }catch(err){
    resultEl.innerHTML = `<div class="error-box">生成に失敗しました：${escapeHtml(err.message)}<br>Worker URLとレスポンス形式をご確認ください。</div>`;
  }finally{
    btn.disabled = false;
  }
}
